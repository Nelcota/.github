name: Bug report
description: Report something that does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use private reporting as described in SECURITY.md. Remove secrets and personal data from all examples."
  - type: input
    id: component
    attributes:
      label: Component and version
      description: The affected project or package and its version or commit.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What you expected, what happened, and the relevant error.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest steps or example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime, database version, or browser as relevant.
