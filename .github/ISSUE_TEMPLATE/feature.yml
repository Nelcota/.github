name: Feature request
description: Propose an improvement and explain the problem it solves.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior and affected component.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing behavior, workarounds, or other approaches.
